<svg xmlns="http://www.w3.org/2000/svg" width="248" height="164" viewBox="0 0 248 164" fill="none">
	<rect width="248" height="164" fill="#FAFAFE" />

	<!-- faint background planes, matching the other system app illustrations -->
	<g opacity="0.5">
		<path d="M0 96 L38 74 L38 132 L0 154 Z" fill="#EEEFF9" />
		<path d="M38 74 L76 96 L76 154 L38 132 Z" fill="#F4F5FC" />
		<path d="M196 30 L248 60 L248 128 L196 98 Z" fill="#F1F2FA" />
	</g>

	<!-- subject sits right of centre and fills the frame, because the card crops
	     the illustration with object-cover object-right -->
	<g transform="translate(12 -12.6) scale(1.08)">
	<!-- base plate everything sits on -->
	<g stroke="#D3D5EE" stroke-width="1">
		<path d="M124 150 L52 108 L124 66 L196 108 Z" fill="#F3F4FB" />
		<path d="M52 108 L52 116 L124 158 L124 150 Z" fill="#E9EAF5" />
		<path d="M124 150 L124 158 L196 116 L196 108 Z" fill="#EFF0F9" />
	</g>

	<!-- one workspace coordinating several capabilities: a main block with two
	     satellites. Deliberately not the agent glyph used by the "Get started"
	     cards on this same page, which would read as a duplicate. -->

	<!-- satellite, set back and higher so it reads as attached, not stacked -->
	<g stroke="#C9CBE9" stroke-width="1" stroke-linejoin="round">
		<path d="M150 63.5 L168 74 L150 84.5 L132 74 Z" fill="#DCDEF3" />
		<path d="M132 74 L150 84.5 L150 97.5 L132 87 Z" fill="#E8E9F6" />
		<path d="M150 84.5 L168 74 L168 87 L150 97.5 Z" fill="#F2F2FA" />
	</g>

	<!-- main block -->
	<g stroke="#C9CBE9" stroke-width="1" stroke-linejoin="round">
		<path d="M112 77 L144 96 L112 115 L80 96 Z" fill="#FFFFFF" />
		<path d="M80 96 L112 115 L112 139 L80 120 Z" fill="#E8E9F6" />
		<path d="M112 115 L144 96 L144 120 L112 139 Z" fill="#F2F2FA" />
	</g>

	<!-- second satellite, front right, smaller for depth -->
	<g stroke="#C9CBE9" stroke-width="1" stroke-linejoin="round">
		<path d="M170 100 L186 109.3 L170 118.6 L154 109.3 Z" fill="#DCDEF3" />
		<path d="M154 109.3 L170 118.6 L170 130.6 L154 121.3 Z" fill="#E8E9F6" />
		<path d="M170 118.6 L186 109.3 L186 121.3 L170 130.6 Z" fill="#F2F2FA" />
	</g>

	<!-- thin links from the main block to each satellite -->
	<g stroke="#AFB2DD" stroke-width="1.25" stroke-linecap="round" opacity="0.8">
		<path d="M136 90 L146 84" />
		<path d="M142 105 L158 111" />
	</g>
	</g>
</svg>
