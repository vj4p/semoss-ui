<!DOCTYPE html>
<html>

<head>
    <!--
        @semoss/sdk reads this for the backend module path. Env.MODULE defaults to
        "", which sends every request to the page origin (/packages/playground/dist/...)
        instead of the API, so the app boots, fires pixels, gets redirects back and
        never renders. Shipping it here means a plain rebuild cannot leave the dist
        without it. The platform rewrites this tag in place (it is keyed by id).
    -->
    <script id="semoss-env" type="application/json">{"MODULE":"/Monolith"}</script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="/src/index.css" rel="stylesheet" />
    <title>Loading...</title>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
</body>
</html>
