<!DOCTYPE html>
<html>

<head>
    <!--
        @semoss/sdk reads this for the backend module path. Env.MODULE
        defaults to "", which sends every request to the page origin
        (/packages/client/dist/...) instead of the API, so the app boots,
        fires pixels, gets redirects back and never renders. The platform
        rewrites this tag in place when it needs a different route prefix —
        it is keyed by id — but shipping it here means a plain rebuild
        cannot leave the dist without it.
    -->
    <script id="semoss-env" type="application/json">{"MODULE":"/Monolith"}</script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link href="/src/index.css" rel="stylesheet" />
    <title>SEMOSS</title>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
</body>
<link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Geist:wght@100;200;300;400;500;600;700&display=swap" />

</html>
